<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade S05 Formulários</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>

    </header>
    <main>
        <form>
            <label for="nome-completo">Nome Completo:</label>
            <input type="text" id="nome-completo" name="nome-completo" required>
            <label for="email-do-usuario">E-mail:</label>
            <input type="email" id="email-do-usuario" name="email-do-usuario" required>
            <label for="quantidade">Selecione a Quantidade</label>
            <select name="quantidade" id="quantidade">
                <option value="1">Um</option>
                <option value="2">Dois</option>
                <option value="3">Três</option>
            </select>
            <label for="navegador">Qual é o seu navegador de internet favorito?</label>
            <select id="navegador" name="navegador">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>
            <label for="pet">Você tem um bichinho de estimação?</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">Liste os lugares onde você morou:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Stillwater Flórida, Amsterdã Holanda, Tibuktu"></textarea>
            <button type="submit">Enviar Pesquisa</button>
        </form>
        <div class="item-formulario">
            <label for="outro-nome">Nome Completo:</label>
            <input type="text" id="outro-nome" name="outro-nome">
        </div>
        <div class="item-formulario coluna1">
            <label for="nome-coluna1">Nome Completo:</label>
            <input type="text" id="nome-coluna1" name="nome-coluna1">
        </div>
        <div class="item-formulario coluna2">
            <label for="email-coluna2">E-mail:</label>
            <input type="email" id="email-coluna2" name="email-coluna2">
        </div>
    </main>
    <footer>

    </footer>
</body>

</html>
